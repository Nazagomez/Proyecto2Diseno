<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Librería Letras Vivas | Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="carrito">

  <header>
    <div class="lv-topbar py-3">
      <div class="container">
        <div class="row align-items-center g-2">
          <div class="col-auto">
            <a href="index.html" class="lv-logo text-decoration-none d-flex align-items-center gap-2">
              <i class="bi bi-bookmark-fill fs-3 text-warning"></i>
              <span>Librería Letras Vivas<small>Tu librería en línea</small></span>
            </a>
          </div>
          <div class="col-auto ms-auto">
            <a href="carrito.html" class="btn btn-outline-light"><i class="bi bi-cart3"></i> Carrito <span class="badge text-bg-danger" id="carrito-badge">3</span></a>
          </div>
        </div>
      </div>
    </div>
    <nav class="navbar navbar-dark lv-navbar lv-sans">
      <div class="container"><ul class="navbar-nav"><li class="nav-item"><a class="nav-link active" href="carrito.html">Carrito</a></li><li class="nav-item"><a class="nav-link" href="facturacion.html">Facturación</a></li></ul></div>
    </nav>
  </header>

  <div class="lv-breadcrumb-bar py-2 lv-sans">
    <div class="container"><nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html">Inicio</a></li><li class="breadcrumb-item active">Carrito</li></ol></nav></div>
  </div>

  <main class="container my-4">
    <h2 class="lv-section-title">Carrito de compras</h2>
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="table-responsive bg-white rounded shadow-sm">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>Producto</th><th class="text-center">Precio</th><th class="text-center">Cantidad</th><th class="text-end">Subtotal</th><th></th></tr></thead>
            <tbody id="carrito-body"></tbody>
          </table>
        </div>
        <a href="catalogo.html" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
      </div>
      <div class="col-lg-4">
        <div class="lv-sidebar lv-sans">
          <h3>Resumen</h3>
          <table class="table table-sm">
            <tr><td>Subtotal</td><td class="text-end" id="carrito-subtotal"></td></tr>
            <tr><td>Envío</td><td class="text-end">₡2.000</td></tr>
            <tr><th>Total</th><th class="text-end lv-price" id="carrito-total"></th></tr>
          </table>
          <a href="facturacion.html" class="btn btn-danger w-100">Finalizar compra</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="lv-footer py-5 mt-5">
    <div class="container text-center small">© 2026 Librería Letras Vivas. Todos los derechos reservados.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/libros.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
