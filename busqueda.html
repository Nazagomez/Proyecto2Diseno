<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Librería Letras Vivas | Búsqueda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="busqueda">

  <header>
    <div class="lv-topbar py-3">
      <div class="container">
        <div class="row align-items-center g-2">
          <div class="col-auto">
            <a href="index.html" class="lv-logo text-decoration-none d-flex align-items-center gap-2">
              <i class="bi bi-bookmark-fill fs-3 text-warning"></i>
              <span>Librería Letras Vivas<small>Tu librería en línea</small></span>
            </a>
          </div>
          <div class="col">
            <form class="d-flex" action="busqueda.html" method="get">
              <input class="form-control rounded-pill" type="search" name="q" id="busqueda-input" placeholder="Buscar libro, autor, categoría..." />
              <button class="btn btn-light ms-2 rounded-pill" type="submit"><i class="bi bi-search"></i></button>
            </form>
          </div>
          <div class="col-auto">
            <a href="carrito.html" class="btn btn-outline-light"><i class="bi bi-cart3"></i> Carrito <span class="badge text-bg-danger">3</span></a>
          </div>
        </div>
      </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark lv-navbar lv-sans">
      <div class="container">
        <div class="collapse navbar-collapse show">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link active" href="busqueda.html">Búsqueda</a></li>
            <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="lv-breadcrumb-bar py-2 lv-sans">
    <div class="container">
      <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0"><li class="breadcrumb-item"><a href="index.html">Inicio</a></li><li class="breadcrumb-item active">Búsqueda</li></ol></nav>
    </div>
  </div>

  <main class="container my-4">
    <form class="mb-4" action="busqueda.html" method="get">
      <div class="input-group input-group-lg">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input class="form-control" type="search" name="q" id="busqueda-input-main" placeholder="Ingrese palabras clave: título, autor o categoría" />
        <button class="btn btn-primary" type="submit">Buscar</button>
      </div>
    </form>
    <h2 class="lv-section-title" id="busqueda-titulo">Resultados</h2>
    <p class="text-muted lv-sans" id="busqueda-contador"></p>
    <div class="row g-3" id="busqueda-grid"></div>
  </main>

  <footer class="lv-footer py-5 mt-5">
    <div class="container text-center small">© 2026 Librería Letras Vivas. Todos los derechos reservados.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/libros.js"></script>
  <script src="js/app.js"></script>
  <script>
    const q = new URLSearchParams(location.search).get('q') || '';
    if (q) document.getElementById('busqueda-input-main').value = q;
  </script>
</body>
</html>
